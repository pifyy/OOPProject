plugins {
    id 'java'
    id 'application'
}

group = 'com.smarthome'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.smarthome.Main'
}

// Lets the console menu read what you type when started with ./gradlew run.
run {
    standardInput = System.in
}

test {
    useJUnitPlatform()
}
